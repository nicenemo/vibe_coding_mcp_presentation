  <div class="page-number"></div>

<script>
  Reveal.addEventListener( 'ready', event => {
    setTimeout(() => {
      const slideNumber = event.indexh;
      const totalSlides = Reveal.getTotalSlides() - 1;
      if (slideNumber > 0) {
        document.querySelector('.page-number').innerHTML = `${slideNumber} / ${totalSlides}`;
      }
    }, 100);
  } );
  Reveal.addEventListener( 'slidechanged', event => {
    const slideNumber = event.indexh;
    const totalSlides = Reveal.getTotalSlides() - 1;
    if (slideNumber > 0) {
      document.querySelector('.page-number').innerHTML = `${slideNumber} / ${totalSlides}`;
    } else {
      document.querySelector('.page-number').innerHTML = '';
    }
  } );
</script>
